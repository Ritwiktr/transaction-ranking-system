services:
  - type: web
    name: txn-ranking-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: txn-ranking-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.5"

  - type: web
    name: txn-ranking-ui
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: |
      if [ -n "$API_BASE_URL" ]; then
        echo "window.API_BASE_URL = \"$API_BASE_URL\";" > js/config.js
      fi
    staticPublishPath: .
    envVars:
      - key: API_BASE_URL
        sync: false

databases:
  - name: txn-ranking-db
    plan: free
    region: oregon
